<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAWS — Prospects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#eef1f7; --card:#ffffff;
    --ink:#1a2444; --muted:#8891a7; --muted-2:#aab1c2;
    --blue:#3a5ef0; --blue-soft:#eaedfd;
    --orange:#ff8a4c; --orange-soft:#fff1e6;
    --green:#17b26a; --green-soft:#e7f9f0;
    --red:#f0533a; --red-soft:#fdeceb;
    --line:#eef0f5;
    --r:20px; --r-sm:12px;
    --shadow:0 2px 6px rgba(26,36,68,.04), 0 14px 32px rgba(26,36,68,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:232px; flex:none; background:var(--card); padding:22px 16px; display:flex; flex-direction:column; gap:4px;
    border-right:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px;}
  .brand .mark{
    width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--blue),#6c8bff);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px;
  }
  .brand b{font-size:16px; font-weight:800;}
  nav.nav{display:flex; flex-direction:column; gap:2px;}
  .nav a{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; text-decoration:none;
    color:var(--muted); font-size:13.5px; font-weight:600;
  }
  .nav a svg{width:18px; height:18px; flex:none;}
  .nav a.active{background:var(--blue-soft); color:var(--blue);}
  .nav a:not(.active):hover{background:#f6f7fb;}
  .nav .badge{margin-left:auto; background:var(--orange); color:#fff; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:20px;}
  .sidebar .logout{margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; color:var(--red); font-size:13.5px; font-weight:600;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:26px 30px 60px; min-width:0;}
  .topline{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  h1.pagetitle{font-size:28px; font-weight:800; margin:0;}
  .search{
    display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 16px; min-width:280px; box-shadow:var(--shadow);
  }
  .search svg{width:16px; height:16px; color:var(--muted-2); flex:none;}
  .search input{border:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; background:transparent;}

  /* Stat cards */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:22px;}
  @media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{
    background:var(--card); border-radius:var(--r); padding:20px 20px 18px; box-shadow:var(--shadow);
  }
  .stat .top{display:flex; align-items:flex-start; justify-content:space-between;}
  .stat .label{font-size:13px; color:var(--muted); font-weight:600;}
  .stat .value{font-size:27px; font-weight:800; margin-top:10px;}
  .stat .sub{font-size:12px; color:var(--muted-2); margin-top:4px;}
  .stat .trend{font-size:12px; font-weight:700; margin-top:4px; display:flex; align-items:center; gap:4px;}
  .trend.up{color:var(--green);} .trend.down{color:var(--red);} .trend.flat{color:var(--muted);}
  .spark{width:56px; height:30px;}

  /* Two-column panels */
  .grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; margin-bottom:22px;}
  @media(max-width:980px){.grid2{grid-template-columns:1fr;}}
  .panel{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:22px;}
  .panel h2{font-size:16px; font-weight:800; margin:0 0 2px;}
  .panel .psub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}

  .donut-wrap{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
  .legend{display:flex; flex-direction:column; gap:12px; flex:1; min-width:160px;}
  .legend .row{display:flex; align-items:center; gap:9px; font-size:13px;}
  .legend .dot{width:9px; height:9px; border-radius:3px; flex:none;}
  .legend .n{margin-left:auto; font-weight:700;}

  .activity{display:flex; flex-direction:column; gap:14px;}
  .activity .item{display:flex; align-items:center; gap:12px;}
  .avatar{
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff; flex:none;
  }
  .activity .name{font-size:13.5px; font-weight:700;}
  .activity .meta{font-size:12px; color:var(--muted);}
  .activity .when{margin-left:auto; font-size:12px; color:var(--muted-2); font-weight:600; text-align:right;}

  /* Table panel */
  .tablepanel{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:22px; overflow:hidden;}
  .tablehead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .tablehead h2{font-size:16px; font-weight:800; margin:0;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  select{
    font-family:inherit; font-size:12.5px; border:1px solid var(--line); background:#fafbfd; color:var(--ink);
    padding:8px 10px; border-radius:10px; font-weight:600;
  }
  .btn{
    font-family:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:9px 15px; border-radius:11px; font-size:13px; font-weight:700;
  }
  .btn:hover{border-color:var(--blue); color:var(--blue);}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 8px 18px rgba(58,94,240,.28);}
  .btn.primary:hover{background:#2c4fe0; color:#fff;}

  table{width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:-8px;}
  thead th{
    text-align:left; font-size:11.5px; font-weight:700; color:var(--muted); text-transform:none;
    padding:0 14px 6px;
  }
  tbody tr{background:#fafbfd;}
  tbody tr:hover{background:var(--blue-soft);}
  tbody td{padding:13px 14px; font-size:13.5px; vertical-align:middle;}
  tbody tr td:first-child{border-radius:14px 0 0 14px;}
  tbody tr td:last-child{border-radius:0 14px 14px 0;}
  .pname{font-weight:700;}
  .paddr{font-size:12px; color:var(--muted); margin-top:1px;}
  .catpill{
    display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
  }
  a.tel, a.site{color:var(--blue); text-decoration:none; font-weight:600; font-size:12.5px;}
  a.tel:hover, a.site:hover{text-decoration:underline;}
  .note{font-size:12px; color:var(--muted-2); font-weight:600;}

  .statut-pill{
    border:none; border-radius:20px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer;
  }
  select.statut-pill.s-a-contacter{background:var(--blue-soft); color:var(--blue);}
  select.statut-pill.s-contacte{background:var(--orange-soft); color:#c2671f;}
  select.statut-pill.s-relance{background:#fdeedd; color:#b5590a;}
  select.statut-pill.s-converti{background:var(--green-soft); color:var(--green);}
  select.statut-pill.s-perdu{background:#f1f2f6; color:var(--muted);}

  .notes-input{
    width:140px; border:none; background:transparent; font-size:12.5px; color:var(--muted); padding:4px; border-radius:8px;
  }
  .notes-input:focus{background:#fff; outline:1px solid var(--line);}
  .icon-btn{border:none; background:transparent; color:var(--muted-2); font-size:14px; cursor:pointer; padding:4px 6px; border-radius:8px;}
  .icon-btn:hover{color:var(--red); background:var(--red-soft);}

  .count{font-size:12px; color:var(--muted); font-weight:600;}
  .empty{padding:50px 10px; text-align:center; color:var(--muted);}

  .overlay{position:fixed; inset:0; background:rgba(26,36,68,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff; border-radius:24px; width:100%; max-width:440px; padding:26px; box-shadow:0 24px 60px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 4px; font-size:17px; font-weight:800;}
  .modal p.sub{margin:0 0 18px; font-size:12.5px; color:var(--muted);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .field input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; font-size:13.5px; font-family:inherit;
    background:#fafbfd;
  }
  .field input:focus{outline:none; border-color:var(--blue);}
  .field select{width:100%; background:#fafbfd;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  /* ---------- Login (même visuel que l'Atelier Devis) ---------- */
  .landing.split{ display:grid; grid-template-columns:minmax(340px,1fr) minmax(420px,1fr); background:#fff; min-height:100vh; }
  .login-brand{ background:#2F2891; color:#fff; padding:3rem 3.2rem; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
  .login-brand::before{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 28px); pointer-events:none; }
  .login-brand > *{ position:relative; }
  .lb-mark{ font-size:26px; font-weight:800; letter-spacing:.18em; }
  .lb-sub{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.62); margin-top:.35rem; }
  .login-form{ display:flex; align-items:center; justify-content:center; padding:2rem; background:#fff; }
  .lf-inner{ width:100%; max-width:360px; }
  .lf-inner h1{ font-size:26px; font-weight:700; margin:0 0 .4rem; }
  .lf-sub{ font-size:14px; color:var(--muted); margin:0 0 1.8rem; }
  .lf-inner .field label{ font-size:12px; font-weight:600; color:#4B5068; }
  .lf-inner input[type=email], .lf-inner input[type=password]{ padding:.7rem .8rem; border-radius:8px; border:1px solid #D5D8E6; font-size:15px; }
  .lf-inner input:focus{ outline:none; border-color:#3F33C4; box-shadow:0 0 0 3px rgba(63,51,196,.14); }
  .lf-remember{ display:flex; align-items:center; gap:.55rem; font-size:13px; color:#4B5068; margin:.3rem 0 1.3rem; cursor:pointer; }
  .lf-remember input{ width:auto; accent-color:#3F33C4; }
  .lf-inner button.btn{ width:100%; background:#3F33C4; border:1px solid #3F33C4; border-radius:8px; padding:.8rem 1rem; font-size:14.5px; font-weight:600; color:#fff; }
  .lf-inner button.btn:hover{ background:#32289F; color:#fff; }
  @media (max-width:820px){ .landing.split{ grid-template-columns:1fr; } .login-brand{ padding:1.6rem; } }
  .sidebar .logout{ cursor:pointer; background:none; border:none; font-family:inherit; width:100%; text-align:left; }
  .sidebar .userline{ margin-top:auto; font-size:11.5px; color:var(--muted-2); padding:0 12px 6px; word-break:break-all; }
  .sidebar .userline + .logout{ margin-top:0; }
  .back-link{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; text-decoration:none; color:var(--muted); font-size:13.5px; font-weight:600; }
  .back-link:hover{ background:#f6f7fb; }
  .btn.small{ padding:6px 11px; font-size:12px; white-space:nowrap; }
  .btn.green{ background:var(--green); color:#fff; border-color:var(--green); }
  .btn.green:hover{ background:#119456; color:#fff; }
  .is-client{ font-size:12px; font-weight:700; color:var(--green); white-space:nowrap; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:12px; font-size:13px; font-weight:600; z-index:99; box-shadow:var(--shadow); }
  .warn{ background:var(--orange-soft); color:#b5590a; padding:10px 14px; border-radius:12px; font-size:12.5px; font-weight:600; margin-bottom:16px; }
  [hidden]{ display:none !important; }
  .embed .sidebar{ display:none; }
  .embed .main{ padding:18px 22px 40px; }
  .embed{ background:transparent; }
</style>

async function initFirebase(){
  try{
    if(typeof firebase === 'undefined'){ console.warn('SDK Firebase non chargé'); return; }
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    fbAuth = firebase.auth();
    try{ await fbDb.enablePersistence({synchronizeTabs:true}); }
    catch(err){ console.warn('Persistance hors-ligne non activée', err && err.code); }
  }catch(e){ console.error('Erreur init Firebase', e); fbDb = null; fbAuth = null; }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}
async function sget(key, fallback){
  if(fbDb){
    try{
      const doc = await withTimeout(fbDb.collection(FIREBASE_COLLECTION).doc(key).get(), 15000);
      return doc.exists ? doc.data().value : fallback;
    }catch(e){ console.error('Firestore get error (bascule sur stockage local)', e); }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function sset(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){}   // copie locale
  if(fbDb){
    for(let i=1;i<=2;i++){
      try{
        await withTimeout(fbDb.collection(FIREBASE_COLLECTION).doc(key).set({value}), 15000);
        return true;
      }catch(e){ console.error(`Firestore set error (${i}/2)`, e); }
    }
    state.offline = true; render();
    return false;
  }
  return false;
}

const state = { authenticated:false, user:null, prospects:[], offline:false, f:{search:'',cat:'',ville:'',statut:''}, modal:false };

const catColor = c => CAT_COLORS[c] || "#aab1c2";
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function initials(n){
  const w = String(n).replace(/[^\p{L}\s]/gu,'').trim().split(/\s+/);
  return ((w[0]||'')[0]||'').toUpperCase() + ((w[1]||'')[0]||'').toUpperCase();
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2800);
}

async function loadAll(){
  let list = await sget('prospects', null);
  if(!Array.isArray(list)){
    // première utilisation : on sème les 22 prospects de départ (ids fixes => pas de doublon si 2 personnes ouvrent en même temps)
    const now = Date.now();
    list = SEED.map((p,i)=>({...p, id:'seed-'+i, addedAt: now - i*3600000}));
    await sset('prospects', list);
  }
  state.prospects = list;
}
// lecture fraîche → modification → écriture (évite d'écraser le travail d'un collègue)
async function mutate(fn){
  let fresh = await sget('prospects', state.prospects);
  if(!Array.isArray(fresh)) fresh = state.prospects;
  fn(fresh);
  state.prospects = fresh;
  await sset('prospects', fresh);
}

// ---------- Convertir en client → Atelier Devis ----------
async function convertToClient(id){
  const p = state.prospects.find(x=>x.id===id);
  if(!p || p.clientId) return;
  if(!fbDb){ toast('Hors-ligne : conversion impossible'); return; }
  const ville = p.ville || '';
  const cpMatch = (p.adresse||'').match(/\b\d{5}\b/);
  try{
    const ref = fbDb.collection(DEVIS_COLLECTION).doc('clients');
    const snap = await withTimeout(ref.get(), 15000);
    const clients = snap.exists && Array.isArray(snap.data().value) ? snap.data().value : [];
    const dup = clients.find(c => (c.nom||'').trim().toLowerCase() === p.nom.trim().toLowerCase());
    let clientId;
    if(dup){
      if(!confirm(`Un client « ${dup.nom} » existe déjà dans l'Atelier Devis.\nLier ce prospect à ce client sans en créer un nouveau ?`)) return;
      clientId = dup.id;
    }else{
      clientId = uid();
      clients.push({
        id: clientId, nom: p.nom, prenom:'', email:'', tel: p.tel||'',
        adresse: p.adresse||'', comp:'', cp: cpMatch?cpMatch[0]:'', ville, categorie:'PROFESSIONNEL'
      });
      await withTimeout(ref.set({value: clients}), 15000);
    }
    await mutate(list=>{ const q=list.find(x=>x.id===id); if(q){ q.clientId = clientId; q.statut='converti'; } });
    toast(dup ? 'Prospect lié au client existant' : 'Client créé dans l\'Atelier Devis ✓');
    render();
  }catch(e){ console.error(e); toast('Échec de la conversion — réessayez'); }
}

// ---------- Rendu ----------
function renderLogin(){
  return `
  <div class="landing split">
    <aside class="login-brand">
      <div><div class="lb-mark">BAWS</div><div class="lb-sub">Prospects</div></div>
    </aside>
    <main class="login-form"><div class="lf-inner">
      <h1>Connexion</h1>
      <p class="lf-sub">Mêmes identifiants que l'Atelier Devis.</p>
      <div class="field"><label>Email</label><input type="email" id="login-user" autocomplete="username"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="login-pass" autocomplete="current-password"></div>
      <label class="lf-remember"><input type="checkbox" id="login-remember" checked> Se souvenir de moi sur cet appareil</label>
      <p id="login-error" style="color:var(--red);font-size:13px;display:none;margin-bottom:.75rem">Identifiant ou mot de passe incorrect.</p>
      <button class="btn" id="login-btn">Se connecter</button>
    </div></main>
  </div>`;
}
function bindLogin(){
  const btn = document.getElementById('login-btn');
  const go = async ()=>{
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    const err = document.getElementById('login-error'); err.style.display='none';
    if(!u||!p) return;
    btn.disabled = true; const orig = btn.textContent; btn.textContent='Connexion…';
    try{
      const rem = document.getElementById('login-remember').checked;
      await fbAuth.setPersistence(rem ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      await fbAuth.signInWithEmailAndPassword(u,p);
    }catch(e){ console.error('Erreur de connexion', e.code); err.style.display='block'; btn.disabled=false; btn.textContent=orig; }
  };
  btn.onclick = go;
  document.getElementById('login-pass').onkeydown = e=>{ if(e.key==='Enter') go(); };
}

function filtered(){
  const {search,cat,ville,statut} = state.f, s = search.trim().toLowerCase();
  return state.prospects.filter(p=>{
    if(cat && p.categorie!==cat) return false;
    if(ville && p.ville!==ville) return false;
    if(statut && p.statut!==statut) return false;
    if(s && !(p.nom+' '+(p.adresse||'')+' '+(p.tel||'')).toLowerCase().includes(s)) return false;
    return true;
  });
}

function donutHtml(){
  const P = state.prospects, counts = {};
  P.forEach(p=>counts[p.categorie]=(counts[p.categorie]||0)+1);
  const total = P.length||1, cx=75, cy=75, r=58, ri=38;
  let angle=-90, paths='';
  Object.entries(counts).forEach(([cat,n])=>{
    let sweep = n/total*360; if(sweep>=359.99) sweep = 359.99;
    const large = sweep>180?1:0, a0=angle*Math.PI/180, a1=(angle+sweep)*Math.PI/180;
    const pt=(rad,a)=>`${cx+rad*Math.cos(a)},${cy+rad*Math.sin(a)}`;
    paths += `<path d="M${pt(r,a0)} A${r},${r} 0 ${large} 1 ${pt(r,a1)} L${pt(ri,a1)} A${ri},${ri} 0 ${large} 0 ${pt(ri,a0)} Z" fill="${catColor(cat)}"/>`;
    angle += sweep;
  });
  const svg = `<svg width="150" height="150" viewBox="0 0 150 150">${paths}<text x="75" y="70" text-anchor="middle" font-size="22" font-weight="800" fill="#1a2444" font-family="Plus Jakarta Sans">${P.length}</text><text x="75" y="88" text-anchor="middle" font-size="11" fill="#8891a7" font-family="Plus Jakarta Sans">prospects</text></svg>`;
  const legend = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="row"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}<span class="n">${n}</span></div>`).join('');
  return `<div class="donut-wrap">${svg}<div class="legend">${legend}</div></div>`;
}

  const f = state.f;
  return `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="mark">B</div><b>BAWS</b></div>
      <nav class="nav">
        <a class="active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Prospects<span class="badge">${total}</span></a>
        <a class="back-link" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Atelier Devis</a>
      </nav>
      <div class="userline">${esc(state.user||'')}</div>
      <button class="logout" id="btnLogout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Déconnexion</button>
    </aside>
    <main class="main">
      <div class="topline">
        <h1 class="pagetitle">Prospects</h1>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" id="search" value="${esc(f.search)}" placeholder="Rechercher un nom, une adresse, un téléphone…"></div>
      </div>
      ${state.offline ? '<div class="warn">Connexion à la base impossible : vos modifications sont gardées sur cet appareil seulement.</div>' : ''}
      <div class="stats">
        <div class="stat"><div class="top"><div><div class="label">Total prospects</div><div class="value">${total}</div></div>${spark('0,22 10,18 20,20 30,10 40,13 56,4','#3a5ef0')}</div><div class="sub">Pipeline complet</div></div>
        <div class="stat"><div class="top"><div><div class="label">À contacter</div><div class="value">${n('a-contacter')}</div></div>${spark('0,8 10,14 20,10 30,18 40,16 56,22','#ff8a4c')}</div><div class="sub">Pas encore approchés</div></div>
        <div class="stat"><div class="top"><div><div class="label">Relance prévue</div><div class="value">${n('relance')}</div></div>${spark('0,18 10,16 20,19 30,12 40,14 56,9','#b5590a')}</div><div class="sub">À recontacter</div></div>
        <div class="stat"><div class="top"><div><div class="label">Taux de conversion</div><div class="value">${taux}%</div></div>${spark('0,24 10,20 20,21 30,15 40,10 56,3','#17b26a')}</div><div class="sub">${conv} converti${conv>1?'s':''}</div></div>
      </div>
      <div class="grid2">
        <div class="panel"><h2>Répartition par catégorie</h2><div class="psub">Vue d'ensemble du pipeline actuel</div>${donutHtml()}</div>
        <div class="panel"><h2>Derniers prospects ajoutés</h2><div class="psub">Les 5 fiches les plus récentes</div>
          <div class="activity">${recent.map(p=>`<div class="item"><div class="avatar" style="background:${catColor(p.categorie)}">${esc(initials(p.nom))}</div><div><div class="name">${esc(p.nom)}</div><div class="meta">${esc(p.categorie)}</div></div><div class="when">${STATUT_LABELS[p.statut]||''}</div></div>`).join('') || '<div class="meta">Aucun prospect pour l\'instant.</div>'}</div></div>
      </div>
      <div class="tablepanel">
        <div class="tablehead"><h2>Tous les prospects</h2>
          <div class="filters">
            <select id="filterCat"><option value="">Catégorie</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
            <select id="filterVille"><option value="">Ville</option>${villes.map(v=>`<option ${f.ville===v?'selected':''}>${esc(v)}</option>`).join('')}</select>
            <select id="filterStatut"><option value="">Statut</option>${Object.entries(STATUT_LABELS).map(([k,l])=>`<option value="${k}" ${f.statut===k?'selected':''}>${l}</option>`).join('')}</select>
            <span class="count">${list.length} / ${total}</span>
            <button class="btn" id="btnExport">Exporter en CSV</button>
            <button class="btn primary" id="btnAdd">+ Ajouter</button>
          </div></div>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th style="width:27%">Prospect</th><th style="width:13%">Catégorie</th><th style="width:15%">Contact</th><th style="width:9%">Avis Google</th><th style="width:14%">Statut</th><th style="width:13%">Notes</th><th style="width:9%"></th><th style="width:24px"></th></tr></thead>
          <tbody>${list.map(rowHtml).join('')}</tbody></table>
          ${list.length ? '' : '<div class="empty">Aucun prospect ne correspond à ces filtres.</div>'}</div>

}
function rowHtml(p){
  const cc = catColor(p.categorie);
  return `<tr>
    <td><div style="display:flex;align-items:center;gap:10px;"><div class="avatar" style="width:32px;height:32px;border-radius:10px;font-size:11.5px;background:${cc}">${esc(initials(p.nom))}</div><div><div class="pname">${esc(p.nom)}</div><div class="paddr">${esc(p.adresse||'')}</div></div></div></td>
    <td><span class="catpill" style="background:${cc}22;color:${cc}">${esc(p.categorie)}</span></td>
    <td>${p.tel?`<div><a class="tel" href="tel:${esc(p.tel)}">${esc(p.tel)}</a></div>`:'<div class="note">—</div>'}${/^https?:\/\//i.test(p.site||'')?`<div><a class="site" href="${esc(p.site)}" target="_blank" rel="noopener">Site ↗</a></div>`:''}</td>
    <td><span class="note">${esc(p.note||'—')}</span></td>
    <td><select class="statut-pill ${STATUT_CLASS[p.statut]}" data-statut="${esc(p.id)}">${Object.entries(STATUT_LABELS).map(([k,l])=>`<option value="${k}" ${p.statut===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td><input class="notes-input" data-notes="${esc(p.id)}" value="${esc(p.notes||'')}" placeholder="—"></td>
    <td>${p.clientId ? '<span class="is-client">✓ Client</span>' : p.statut==='converti' ? `<button class="btn small green" data-convert="${esc(p.id)}">Convertir en client</button>` : ''}</td>
    <td><button class="icon-btn" data-del="${esc(p.id)}" title="Supprimer">✕</button></td>
  </tr>`;
}
function modalHtml(){
  return `<div class="overlay open" id="overlay"><div class="modal">
    <h2>Nouveau prospect</h2><p class="sub">Ajouter une fiche (Google Maps, salon, recommandation…)</p>
    <div class="field"><label>Nom de l'entreprise</label><input type="text" id="fNom" placeholder="Ex : Cabinet Durand Syndic"></div>
    <div class="row2">
      <div class="field"><label>Catégorie</label><select id="fCat">${Object.keys(CAT_COLORS).map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Ville</label><input type="text" id="fVille" placeholder="Paris"></div>
    </div>
    <div class="field"><label>Adresse</label><input type="text" id="fAdresse" placeholder="12 Rue Exemple, 75010 Paris"></div>
    <div class="row2">
      <div class="field"><label>Téléphone</label><input type="text" id="fTel" placeholder="+33 1 23 45 67 89"></div>
      <div class="field"><label>Site web</label><input type="text" id="fSite" placeholder="https://..."></div>
    </div>
    <div class="modal-actions"><button class="btn" id="btnCancel">Annuler</button><button class="btn primary" id="btnSave">Ajouter</button></div>
  </div></div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!state.authenticated){ app.innerHTML = renderLogin(); bindLogin(); return; }
  // on garde le focus de la recherche pendant la frappe
  const hadSearch = document.activeElement && document.activeElement.id==='search';
  const pos = hadSearch ? document.activeElement.selectionStart : 0;
  const scroll = window.scrollY;
  app.innerHTML = renderShell();
  bindShell();
  window.scrollTo(0, scroll);
  if(hadSearch){ const s=document.getElementById('search'); s.focus(); s.setSelectionRange(pos,pos); }
}

function bindShell(){
  const $ = id => document.getElementById(id);
  $('btnLogout').onclick = async ()=>{ try{ await fbAuth.signOut(); }catch(e){ console.error(e); } };
  $('search').oninput = e=>{ state.f.search = e.target.value; render(); };
  $('filterCat').onchange = e=>{ state.f.cat = e.target.value; render(); };
  $('filterVille').onchange = e=>{ state.f.ville = e.target.value; render(); };
  $('filterStatut').onchange = e=>{ state.f.statut = e.target.value; render(); };
  $('btnAdd').onclick = ()=>{ state.modal = true; render(); };
  if(state.modal){
    $('btnCancel').onclick = ()=>{ state.modal=false; render(); };
    $('overlay').onclick = e=>{ if(e.target.id==='overlay'){ state.modal=false; render(); } };
    $('btnSave').onclick = async ()=>{
      const nom = $('fNom').value.trim();
      if(!nom){ alert('Le nom est obligatoire.'); return; }
      const p = { id:uid(), nom, categorie:$('fCat').value, ville:$('fVille').value.trim()||'Paris', adresse:$('fAdresse').value.trim(),
        tel:$('fTel').value.trim(), site:$('fSite').value.trim(), note:'—', statut:'a-contacter', notes:'', addedAt:Date.now() };
      state.modal = false;
      await mutate(l=>l.push(p)); render(); toast('Prospect ajouté');
    };
  }
  document.querySelectorAll('[data-statut]').forEach(sel=>sel.onchange = async e=>{
    const id = sel.dataset.statut, v = e.target.value;
    await mutate(l=>{ const p=l.find(x=>x.id===id); if(p) p.statut=v; }); render();
  });
  document.querySelectorAll('[data-notes]').forEach(inp=>inp.onchange = async e=>{
    const id = inp.dataset.notes, v = e.target.value;
    await mutate(l=>{ const p=l.find(x=>x.id===id); if(p) p.notes=v; });
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick = async ()=>{
    if(!confirm('Supprimer ce prospect ?')) return;
    const id = b.dataset.del;
    await mutate(l=>{ const i=l.findIndex(x=>x.id===id); if(i>=0) l.splice(i,1); }); render();
  });
  document.querySelectorAll('[data-convert]').forEach(b=>b.onclick = ()=>convertToClient(b.dataset.convert));
  $('btnExport').onclick = exportCsv;
}

function exportCsv(){
  const head = ['Nom','Catégorie','Ville','Adresse','Téléphone','Site web','Note Google','Statut','Notes'];
  const lines = [head.join(';')].concat(state.prospects.map(p=>
    [p.nom,p.categorie,p.ville,p.adresse,p.tel,p.site,p.note,STATUT_LABELS[p.statut]||p.statut,p.notes]
      .map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')));
  const blob = new Blob(["﻿"+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'prospects_baws.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

if(new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');
(async function init(){
  await initFirebase();
  if(!fbAuth){
    document.getElementById('app').innerHTML = '<div style="padding:40px;font-family:sans-serif">Firebase indisponible — impossible de se connecter. Rechargez la page.</div>';
    return;
  }
  let loaded = false;
  fbAuth.onAuthStateChanged(async user=>{
    state.authenticated = !!user;
    state.user = user ? user.email : null;
    if(user && !loaded){
      loaded = true;
      try{ await withTimeout(loadAll(), 15000); }catch(e){ console.error('Chargement trop long', e); }
    }
    if(!user) loaded = false;
    render();
  });
})();
</script>
